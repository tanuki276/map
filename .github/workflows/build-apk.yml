name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'apk/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Check world and warp travel
        run: sh scripts/check-world.sh
      - name: Copy APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/Fablewind-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fablewind-Android-APK
          path: apk/Fablewind-debug.apk
          retention-days: 30
      - name: Commit APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/Fablewind-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Android debug APK [skip ci]"
            git push
          fi

