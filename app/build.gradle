plugins { id 'com.android.application' }

android {
    namespace 'jp.tanuki.fablewind'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.tanuki.fablewind'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'jp.tanuki.fablewind.SmokeInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

